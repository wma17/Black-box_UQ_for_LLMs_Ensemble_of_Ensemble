[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eoe-uq"
version = "0.1.0"
description = "Black-Box Uncertainty Quantification for Large Language Models via Ensemble-of-Ensembles (NeurIPS 2026)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Wang Ma" },
    { name = "Debarun Bhattacharjya" },
    { name = "Junkyu Lee" },
    { name = "Nhan H. Pham" },
    { name = "Harsha Kokel" },
    { name = "Qiang Ji" },
]
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "sentence-transformers>=2.6",
    "numpy>=1.24",
    "tqdm",
    "accelerate",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["eoe_uq"]
